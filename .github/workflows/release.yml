# Builds an installer and publishes it as a GitHub release.
#
# Triggered by a version tag, because the tag is where the version comes from:
# cmake/Version.cmake reads `git describe`, so a build from tag v0.2.0 reports
# 0.2.0 and a build from anywhere else says which commit it is instead. There
# is no version number to remember to edit.
#
# The workflow also computes the installer's SHA-256 and puts it in the release
# notes. That is not decoration -- the in-app updater refuses to download an
# asset it cannot check against a published checksum, so a release without one
# simply will not update anybody.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

env:
  QT_VERSION: 6.8.3

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out, with submodules and tags
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Version.cmake needs the tags, and `git describe` needs enough
          # history to find the nearest one.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build HuskarUI
        shell: pwsh
        run: |
          # Installed into the working tree rather than into the Qt SDK, so the
          # build cannot pick up a different copy by accident -- the same
          # reasoning as scripts/build-huskarui.bat.
          cmake -G Ninja -S third_party/HuskarUI -B build/huskarui `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/third_party/HuskarUI-install" `
            -DBUILD_HUSKARUI_GALLERY=OFF `
            -DINSTALL_HUSKARUI_IN_DEFAULT_LOCATION=OFF
          cmake --build build/huskarui --parallel
          cmake --install build/huskarui

      - name: Configure
        shell: pwsh
        run: |
          cmake -G Ninja -S . -B build/dreamdsp `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DHuskarUI_DIR="$env:GITHUB_WORKSPACE/third_party/HuskarUI-install/lib/cmake/HuskarUI"

      - name: Build
        run: cmake --build build/dreamdsp --parallel

      - name: Run DSP and preset regression tests
        shell: pwsh
        run: |
          # The offline suite proves the signal processing before anything is
          # published. It needs no audio device, so it runs on the runner.
          ctest --test-dir build/dreamdsp --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "DSP or preset regression tests failed" }

      - name: Stage the payload
        shell: pwsh
        run: |
          $stage = "build/stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/dreamdsp/DreamDSP.exe        $stage
          Copy-Item build/dreamdsp/DreamDspApo.dll     $stage
          Copy-Item build/dreamdsp/HuskarUIBasic.dll   $stage
          Copy-Item build/dreamdsp/HuskarUIImpl.dll    $stage
          Copy-Item build/dreamdsp/KEMAR-NOTICE.md    $stage
          # windeployqt brings the Qt runtime and the QML plugins the app
          # actually imports; --qmldir is what makes it see HuskarUI's.
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" `
              --release --no-translations --no-system-d3d-compiler `
              --qmldir qml `
              --qmldir third_party/HuskarUI-install/qml `
              "$stage/DreamDSP.exe"
          Copy-Item third_party/HuskarUI-install/qml/HuskarUI $stage/HuskarUI -Recurse -Force

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v',''
          "tag=$tag"         | Out-File -Append $env:GITHUB_OUTPUT
          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT

      # The installer is 50 MB and 40 of them are the Qt runtime, which does not
      # change between releases. So alongside it, publish what actually differs:
      # a manifest of every file in the payload, and a delta container holding
      # only the files whose SHA-256 is not what the previous release had.
      #
      # The delta applies on top of exactly one version -- the one before this --
      # because that is the only base whose file contents are known here. A copy
      # on anything older takes the installer, which is still published and still
      # the thing the checksum in the notes describes.
      - name: Manifest and incremental delta
        id: delta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ steps.version.outputs.version }}"
          $tag     = "${{ steps.version.outputs.tag }}"
          $stage   = (Resolve-Path build/stage).Path

          # The payload as it will be installed: relative path, size, SHA-256.
          # Sorted, so two runs of the same tree produce the same manifest and
          # the delta below is a diff of contents rather than of directory order.
          $files = @(
            Get-ChildItem $stage -Recurse -File | ForEach-Object {
              [pscustomobject]@{
                path   = ($_.FullName.Substring($stage.Length + 1).Split([IO.Path]::DirectorySeparatorChar) -join '/')
                size   = $_.Length
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              }
            } | Sort-Object path
          )

          $manifestPath = "build/DreamDSP-$version-manifest.json"
          $manifestJson = [ordered]@{ version = $version; files = $files } |
                          ConvertTo-Json -Depth 8 -Compress
          [IO.File]::WriteAllText((Join-Path $PWD $manifestPath), $manifestJson,
                                  (New-Object Text.UTF8Encoding($false)))
          Write-Host "manifest: $($files.Count) files -> $manifestPath"

          $assets = @($manifestPath)

          # The newest earlier release that published a manifest. Releases before
          # this workflow change have none, and neither does the first one after
          # it -- the delta starts with the release after that, which is correct
          # rather than convenient.
          $cur = [version]$version
          $prev = $null
          $prevVer = $null
          $prevAsset = $null
          foreach ($r in (gh api "repos/${{ github.repository }}/releases?per_page=50" | ConvertFrom-Json)) {
            if ($r.draft -or $r.prerelease -or $r.tag_name -eq $tag) { continue }
            try { $rv = [version]($r.tag_name -replace '^v','') } catch { continue }
            if ($rv -ge $cur) { continue }
            $m = $r.assets | Where-Object { $_.name -like '*-manifest.json' } | Select-Object -First 1
            if (-not $m) { continue }
            if (-not $prev -or $rv -gt $prevVer) { $prev = $r; $prevVer = $rv; $prevAsset = $m }
          }

          $deltaPath = $null
          if ($prev) {
            $dir = "build/prev-manifest"
            New-Item -ItemType Directory -Force $dir | Out-Null
            gh release download $prev.tag_name --pattern $prevAsset.name --dir $dir --clobber
            $old = Get-Content (Join-Path $dir $prevAsset.name) -Raw | ConvertFrom-Json

            $oldHash = @{}
            foreach ($f in $old.files) { $oldHash[$f.path] = $f.sha256 }
            $newHash = @{}
            foreach ($f in $files)     { $newHash[$f.path] = $f.sha256 }

            $changed = @($files | Where-Object {
              -not $oldHash.ContainsKey($_.path) -or $oldHash[$_.path] -ne $_.sha256 })
            $removed = @($old.files | Where-Object { -not $newHash.ContainsKey($_.path) } |
                         ForEach-Object { $_.path })

            $base = $prev.tag_name -replace '^v',''
            $header = [ordered]@{ version = $version; base = $base
                                  files = $changed; remove = $removed }
            $headerBytes = [Text.Encoding]::UTF8.GetBytes(
              ($header | ConvertTo-Json -Depth 8 -Compress))

            # The container format is described in src/core/FileUpdate.h and read
            # there; it is deliberately trivial so that the two implementations
            # cannot disagree about anything but the bytes themselves.
            $deltaPath = "build/DreamDSP-$version-files-from-$base.bin"
            $out = [IO.File]::Create((Join-Path $PWD $deltaPath))
            try {
              $out.Write([Text.Encoding]::ASCII.GetBytes("DDUPD1`n"), 0, 7)
              $len = [BitConverter]::GetBytes([uint32]$headerBytes.Length)
              if ([BitConverter]::IsLittleEndian) { [Array]::Reverse($len) }
              $out.Write($len, 0, 4)
              $out.Write($headerBytes, 0, $headerBytes.Length)
              foreach ($f in $changed) {
                $in = [IO.File]::OpenRead((Join-Path $stage $f.path))
                try { $in.CopyTo($out) } finally { $in.Close() }
              }
            } finally { $out.Close() }

            $assets += $deltaPath
            $mb = (Get-Item $deltaPath).Length / 1MB
            Write-Host ("delta from {0}: {1} changed, {2} removed, {3:N1} MB" -f
                        $base, $changed.Count, $removed.Count, $mb)
          } else {
            Write-Host "no earlier release with a manifest -- publishing the installer only"
          }

          # The updater reads one `SHA-256: <hash>  <name>` line per asset and
          # will not offer anything whose line is missing.
          $checksums = foreach ($a in $assets) {
            "SHA-256: $((Get-FileHash $a -Algorithm SHA256).Hash.ToLower())  $(Split-Path $a -Leaf)"
          }

          # Explicitly UTF-8: Windows PowerShell 5.1 would otherwise write
          # UTF-16 here and the runner would read mojibake.
          "assets<<DDEOF" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          ($assets -join "`n") | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "DDEOF" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "checksums<<DDEOF" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          ($checksums -join "`n") | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "DDEOF" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build the installer
        shell: pwsh
        run: |
          # Inno Setup is not on the runner image by default.
          choco install innosetup --no-progress -y
          # ${env:...} braces are required: PowerShell parses $env:ProgramFiles
          # and then treats the "(x86)" as a separate expression.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc `
              /DAppVersion=${{ steps.version.outputs.version }} `
              /DStageDir=$env:GITHUB_WORKSPACE\build\stage `
              /DOutDir=$env:GITHUB_WORKSPACE\build\installer `
              installer\DreamDSP.iss

      - name: Checksum
        id: checksum
        shell: pwsh
        run: |
          $file = Get-ChildItem build/installer/*.exe | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "file=$($file.FullName)" | Out-File -Append $env:GITHUB_OUTPUT
          "name=$($file.Name)"     | Out-File -Append $env:GITHUB_OUTPUT
          "sha256=$hash"           | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "$hash  $($file.Name)"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DreamDSP ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          # The installer, plus the manifest and the delta when there is one.
          files: |
            ${{ steps.checksum.outputs.file }}
            ${{ steps.delta.outputs.assets }}
          body: |
            ## DreamDSP ${{ steps.version.outputs.version }}

            系统级音频 DSP:参数均衡、效果机架、任意采样率的卷积。

            安装后到「系统音频」页安装音频组件并接入你的输出设备 —— 那一页会逐项检查并告诉你哪一步没完成。
            接入需要重启一次音频服务,全机声音会短暂中断。

            ### 从旧版本升级

            参数格式偶尔会变。变了的时候旧的音频组件会拒绝新的参数块并保持
            上一次的设置不动 —— 声音不会中断,但改动不生效,底部状态栏会写
            「参数还在同步」。看到那句话就到「系统音频」页重新安装一次音频组件。
            没有这句话就不必重装。这次的改动是否涉及参数格式,写在下面 tag 的
            说明里,请以那里为准。

            ### 校验

            下载后请核对,应用内的自动更新也是照这里逐行校验的:

            ```
            SHA-256: ${{ steps.checksum.outputs.sha256 }}  ${{ steps.checksum.outputs.name }}
            ${{ steps.delta.outputs.checksums }}
            ```

            除安装包外还附带两个文件:`-manifest.json` 是整个安装内容的文件清单,
            `-files-from-<基础版本>.bin` 是相对上一个版本的增量包。应用内的自动更新
            优先用增量包(几 MB 而不是五十 MB),校验不过或装不进去就退回完整安装包;
            两个文件的校验值同样在上面这几行里。

            ### 卸载

            卸载程序会先移除音频组件再删除文件。若曾手动接入过其他设备,
            请先在设置页把它们关掉。
